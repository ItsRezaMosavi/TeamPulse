name: Build

on:
  push:
    branches:
      - main
      - master
 
  pull_request:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BuildingBlocks.sln --verbosity detailed

      - name: Build
        run: dotnet build BuildingBlocks.sln --configuration Release --no-restore